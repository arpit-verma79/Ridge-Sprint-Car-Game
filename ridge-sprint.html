<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ridge Sprint — 60s Time Attack</title>
<style>
  :root{
    --text:#2C2C2B; --muted:#7D7A75; --canvas:#FFFFFF; --surface:#F9F8F7;
    --surface2:#F0EFED; --border:#E6E5E3; --blue:#2783DE; --blue-soft:#E5F2FC;
    --green:#46A171; --orange:#D5803B; --red:#E56458;
  }
  @media (prefers-color-scheme: dark){
    :root{ --text:#FFFFFF; --muted:rgba(255,255,255,.65); --canvas:#191919;
      --surface:#202020; --surface2:#383836; --border:rgba(255,255,255,.2);
      --blue:#5E9FE8; --blue-soft:rgba(94,159,232,.12); --green:#72BC8F;
      --orange:#DE9255; --red:#E97366; }
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--canvas); color:var(--text);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex; align-items:center; justify-content:center; padding:16px;
  }
  .wrap{width:100%; max-width:960px}
  header{display:flex; align-items:baseline; gap:12px; margin:0 0 12px}
  h1{font-size:20px; margin:0; letter-spacing:-.01em}
  .sub{color:var(--muted); font-size:14px}
  .stage{position:relative; border:1px solid var(--border); border-radius:12px; overflow:hidden;
    background:var(--surface); box-shadow:0 1px 2px rgba(0,0,0,.05),0 4px 12px rgba(0,0,0,.04)}
  canvas{display:block; width:100%; height:auto; aspect-ratio:16/9}
  .hud{position:absolute; inset:12px 12px auto 12px; display:flex; gap:8px; pointer-events:none}
  .chip{background:rgba(25,25,25,.55); color:#fff; backdrop-filter:blur(6px);
    border-radius:8px; padding:6px 10px; font-size:14px; font-variant-numeric:tabular-nums}
  .chip b{font-size:16px}
  .chip.right{margin-left:auto}
  .overlay{position:absolute; inset:0; display:grid; place-items:center; text-align:center;
    background:rgba(25,25,25,.62); backdrop-filter:blur(3px); color:#fff; padding:24px}
  .overlay.hide{display:none}
  .overlay h2{margin:0 0 8px; font-size:28px; letter-spacing:-.02em}
  .overlay p{margin:0 auto 16px; color:rgba(255,255,255,.72); font-size:14px; max-width:44ch}
  .btn{appearance:none; border:0; cursor:pointer; background:var(--blue); color:#fff;
    font:600 16px/1 inherit; padding:14px 22px; border-radius:8px; min-height:44px}
  .btn:focus-visible{outline:3px solid #fff; outline-offset:2px}
  .pick{font-size:12px; letter-spacing:.08em; text-transform:uppercase;
    color:rgba(255,255,255,.55); margin:0 0 6px}
  .diffs{display:flex; gap:8px; justify-content:center; margin:0 0 14px; flex-wrap:wrap}
  .diff{appearance:none; cursor:pointer; min-height:44px; padding:8px 16px; border-radius:8px;
    border:1px solid rgba(255,255,255,.28); background:rgba(255,255,255,.08); color:#fff;
    font:500 15px/1.2 inherit; text-align:center}
  .diff small{display:block; font-size:12px; color:rgba(255,255,255,.6); margin-top:3px}
  .diff[aria-pressed="true"]{background:#fff; color:#2C2C2B; border-color:#fff; font-weight:600}
  .diff[aria-pressed="true"] small{color:#7D7A75}
  .diff:focus-visible{outline:3px solid #fff; outline-offset:2px}
  .scores{margin:0 auto 16px; max-width:320px; font-size:13px; color:rgba(255,255,255,.78);
    font-variant-numeric:tabular-nums; text-align:left}
  .scores .row{display:flex; gap:8px; padding:3px 0; border-bottom:1px solid rgba(255,255,255,.12)}
  .scores .row:last-child{border-bottom:0}
  .scores .row b{width:22px; color:rgba(255,255,255,.5); font-weight:500}
  .scores .row span{margin-left:auto; color:#fff; font-weight:600}
  .scores .cap{font-size:12px; letter-spacing:.08em; text-transform:uppercase;
    color:rgba(255,255,255,.5); margin:0 0 4px; text-align:center}
  .pads{display:none; gap:8px; margin-top:12px}
  .pad{flex:1; min-height:56px; border:1px solid var(--border); border-radius:8px;
    background:var(--surface2); color:var(--text); font:600 15px/1 inherit; cursor:pointer}
  .legend{display:flex; gap:16px; flex-wrap:wrap; color:var(--muted); font-size:14px; margin-top:12px}
  kbd{background:var(--surface2); border:1px solid var(--border); border-radius:6px;
    padding:2px 6px; font:13px/1 Menlo,Consolas,monospace; color:var(--text)}
  @media (max-width:640px){ .pads{display:flex} .legend{display:none} h1{font-size:18px} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Ridge Sprint</h1>
    <span class="sub" id="sub">60-second time attack</span>
  </header>

  <div class="stage">
    <canvas id="game" width="1024" height="576" aria-label="Racing game"></canvas>
    <div class="hud">
      <div class="chip">SPEED <b id="hudSpeed">0</b> km/h</div>
      <div class="chip">DIST <b id="hudDist">0</b> m</div>
      <div class="chip right" id="hudDiff">NORMAL</div>
      <div class="chip">TIME <b id="hudTime">60.0</b></div>
      <div class="chip">LIVES <b id="hudLives">♥♥♥</b></div>
    </div>
    <div class="overlay" id="overlay">
      <div>
        <h2 id="ovTitle">Ready to drive?</h2>
        <p id="ovText">Hold accelerate, ease off in the curves, and thread the traffic. Cover as much distance as you can before the clock runs out.</p>
        <div class="pick">Car</div>
        <div class="diffs" id="cars" role="group" aria-label="Car model">
          <button class="diff" data-car="comet" aria-pressed="true">Comet GT<small>balanced</small></button>
          <button class="diff" data-car="bolt" aria-pressed="false">Bolt X<small>top speed</small></button>
          <button class="diff" data-car="boulder" aria-pressed="false">Boulder 4x4<small>grip · heavy</small></button>
          <button class="diff" data-car="vesper" aria-pressed="false">Vesper R<small>quick launch</small></button>
        </div>
        <div class="pick">Difficulty</div>
        <div class="diffs" id="diffs" role="group" aria-label="Difficulty">
          <button class="diff" data-diff="easy" aria-pressed="false">Rookie<small>75s · light traffic</small></button>
          <button class="diff" data-diff="normal" aria-pressed="true">Normal<small>60s · mixed traffic</small></button>
          <button class="diff" data-diff="pro" aria-pressed="false">Pro<small>50s · fast packs</small></button>
        </div>
        <div class="scores" id="scores"></div>
        <button class="btn" id="startBtn">Start race</button>
      </div>
    </div>
  </div>

  <div class="pads">
    <button class="pad" id="padLeft" aria-label="Steer left">◀</button>
    <button class="pad" id="padBrake" aria-label="Brake">BRAKE</button>
    <button class="pad" id="padGas" aria-label="Accelerate">GAS</button>
    <button class="pad" id="padRight" aria-label="Steer right">▶</button>
  </div>

  <div class="legend">
    <span><kbd>↑</kbd>/<kbd>W</kbd> accelerate</span>
    <span><kbd>↓</kbd>/<kbd>S</kbd> brake</span>
    <span><kbd>←</kbd><kbd>→</kbd> steer</span>
    <span><kbd>R</kbd> restart</span>
    <span id="bestLine"></span>
  </div>
</div>

<script>
(function(){
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  // ---- pseudo-3D road constants -------------------------------------------
  const segmentLength = 200, rumbleLength = 3, drawDistance = 220;
  const roadWidth = 2000, lanes = 3;
  const fieldOfView = 100, cameraHeight = 1000;
  const cameraDepth = 1 / Math.tan((fieldOfView / 2) * Math.PI / 180);
  const playerZ = cameraHeight * cameraDepth;
  const maxSpeed = segmentLength * 60;
  const accel = maxSpeed / 4.5, braking = -maxSpeed / 1.6, decel = -maxSpeed / 6;
  const offRoadDecel = -maxSpeed / 1.8, offRoadLimit = maxSpeed / 3.4;
  const centrifugal = 0.32;

  const COLORS = {
    light: { road:'#4A4A48', grass:'#3E7F5C', rumble:'#F5F3F0', lane:'#F5F3F0' },
    dark:  { road:'#454543', grass:'#37714F', rumble:'#D5803B' },
    sky:'#BFD9EE', skyLow:'#E9EFF3', hill:'#5E8F73', hillFar:'#8FAE9B'
  };

  // ---- difficulty ----------------------------------------------------------
  const DIFFS = {
    easy:   { label:'ROOKIE', timer:75, traffic:26, cruise:[0.14,0.36], fastShare:0.10, fast:[0.80,0.95], grip:1.15, topSpeed:0.92 },
    normal: { label:'NORMAL', timer:60, traffic:44, cruise:[0.20,0.50], fastShare:0.28, fast:[0.95,1.10], grip:1.00, topSpeed:1.00 },
    pro:    { label:'PRO',    timer:50, traffic:66, cruise:[0.26,0.60], fastShare:0.48, fast:[1.08,1.30], grip:0.86, topSpeed:1.08 }
  };
  let difficulty = localStorage.getItem('ridgeSprintDiff') || 'normal';
  if (!DIFFS[difficulty]) difficulty = 'normal';
  let cfg = DIFFS[difficulty];

  // ---- car models ----------------------------------------------------------
  const CARS = {
    comet:   { name:'Comet GT',    body:'#2783DE', accent:'#F5F3F0', shape:'formula', accelMul:1.00, topMul:1.00, gripMul:1.00 },
    bolt:    { name:'Bolt X',      body:'#E56458', accent:'#2C2C2B', shape:'wedge',   accelMul:0.90, topMul:1.12, gripMul:0.90 },
    boulder: { name:'Boulder 4x4', body:'#46A171', accent:'#EDEAE6', shape:'truck',   accelMul:0.85, topMul:0.92, gripMul:1.22 },
    vesper:  { name:'Vesper R',    body:'#EAC26B', accent:'#2C2C2B', shape:'coupe',   accelMul:1.18, topMul:0.96, gripMul:1.06 }
  };
  let carKey = localStorage.getItem('ridgeSprintCar') || 'comet';
  if (!CARS[carKey]) carKey = 'comet';
  let car = CARS[carKey];

  let segments = [], trackLength = 0, cars = [];
  let position = 0, speed = 0, playerX = 0, shake = 0;
  let distance = 0, timeLeft = cfg.timer, state = 'menu';
  const MAX_LIVES = 3;
  let lives = MAX_LIVES, invuln = 0;
  const bestKey = d => 'ridgeSprintBest_' + d;
  let best = Number(localStorage.getItem(bestKey(difficulty)) || 0);

  // ---- high scores ---------------------------------------------------------
  const SCORES_KEY = 'ridgeSprintScores';
  function loadScores(){
    try { return JSON.parse(localStorage.getItem(SCORES_KEY)) || []; }
    catch (e) { return []; }
  }
  function saveScore(dist){
    const list = loadScores();
    list.push({ d: Math.round(dist), diff: difficulty, car: carKey, t: Date.now() });
    list.sort((a,b) => b.d - a.d);
    const top = list.slice(0, 5);
    try { localStorage.setItem(SCORES_KEY, JSON.stringify(top)); } catch (e) {}
    return top.indexOf(list.find(s => s.t === top[0].t)) === 0 && top[0].d === Math.round(dist);
  }

  const keys = {};
  const touch = { left:false, right:false, gas:false, brake:false };

  const lerp = (a,b,p) => a + (b-a)*p;
  const clamp = (v,lo,hi) => Math.max(lo, Math.min(hi, v));
  const easeIn  = (a,b,p) => a + (b-a)*Math.pow(p,2);
  const easeOut = (a,b,p) => a + (b-a)*(1-Math.pow(1-p,2));
  const easeInOut = (a,b,p) => a + (b-a)*(-Math.cos(p*Math.PI)/2 + 0.5);

  function lastY(){ return segments.length ? segments[segments.length-1].p2.world.y : 0; }

  function addSegment(curve, y){
    const n = segments.length;
    segments.push({
      index:n, curve:curve,
      p1:{ world:{ y:lastY(), z:n*segmentLength }, camera:{}, screen:{} },
      p2:{ world:{ y:y, z:(n+1)*segmentLength }, camera:{}, screen:{} },
      color: Math.floor(n/rumbleLength) % 2 ? COLORS.dark : COLORS.light,
      sprites: [],
      clip: H
    });
  }

  function addRoad(enter, hold, leave, curve, y){
    const startY = lastY(), endY = startY + (y||0)*segmentLength;
    const total = enter + hold + leave;
    for (let i=0;i<enter;i++) addSegment(easeIn(0,curve,i/enter), easeInOut(startY,endY,i/total));
    for (let i=0;i<hold;i++)  addSegment(curve, easeInOut(startY,endY,(enter+i)/total));
    for (let i=0;i<leave;i++) addSegment(easeInOut(curve,0,i/leave), easeInOut(startY,endY,(enter+hold+i)/total));
  }

  function buildTrack(){
    segments = [];
    const S = 24, M = 48, L = 96;
    addRoad(M, M, M, 0, 0);
    addRoad(M, M, M, 3, 24);
    addRoad(S, L, S, -4, 0);
    addRoad(M, M, M, 0, -32);
    addRoad(M, L, M, 5, 16);
    addRoad(S, M, S, -6, 0);
    addRoad(M, M, M, 2, 40);
    addRoad(L, L, L, -2, -40);
    addRoad(M, M, M, 7, 0);
    addRoad(M, L, M, -3, 20);
    addRoad(M, M, M, 0, 0);
    addScenery();
    // start/finish stripe look
    for (let i=0;i<rumbleLength;i++) segments[i].color = { road:'#EDEAE6', grass:COLORS.light.grass, rumble:'#2C2C2B', lane:'#2C2C2B' };
    trackLength = segments.length * segmentLength;
  }

  // ---- roadside scenery ----------------------------------------------------
  function addScenery(){
    const side = () => (Math.random() < 0.5 ? -1 : 1);
    for (let i=0;i<segments.length;i++){
      const seg = segments[i];
      if (i % 4 === 0){
        const s = side();
        seg.sprites.push({ type: Math.random() < 0.55 ? 'pine' : 'oak',
          offset: s * (1.25 + Math.random()*2.4), size: 0.8 + Math.random()*0.7 });
      }
      if (i % 3 === 1) seg.sprites.push({ type:'bush', offset: side()*(1.08 + Math.random()*0.5), size: 0.5 + Math.random()*0.4 });
      if (i % 47 === 0) seg.sprites.push({ type:'sign', offset: side()*1.85, size: 0.62 });
      if (i % 79 === 0) seg.sprites.push({ type:'billboard', offset: side()*2.9, size: 0.75 });
      if (i % 11 === 5) seg.sprites.push({ type:'post', offset: side()*1.12, size: 0.6 });
      if (i % 137 === 0) seg.sprites.push({ type:'windmill', offset: side()*4.2, size: 1.6 });
    }
    // arch over the start line
    segments[2].sprites.push({ type:'arch', offset: 0, size: 1 });
  }

  const CAR_PALETTE = ['#E56458','#EAC26B','#72BC8F','#BF8EDA','#DE9255','#4FB9C9'];
  const FAST_PALETTE = ['#2783DE','#E56458','#191919'];
  const rand = (a,b) => a + Math.random()*(b-a);

  function buildTraffic(){
    cars = [];
    for (let i=0;i<cfg.traffic;i++){
      const fast = Math.random() < cfg.fastShare;
      const offset = (Math.random() < 0.5 ? -1 : 1) * (fast ? rand(0.05,0.55) : rand(0.12,0.85));
      cars.push({
        fast: fast,
        offset: offset,
        z: Math.floor(Math.random()*segments.length) * segmentLength,
        speed: maxSpeed * (fast ? rand(cfg.fast[0], cfg.fast[1]) : rand(cfg.cruise[0], cfg.cruise[1])),
        color: fast ? FAST_PALETTE[i % FAST_PALETTE.length] : CAR_PALETTE[i % CAR_PALETTE.length],
        w: fast ? 168 : 200,
        drift: fast ? rand(0.15,0.4) : 0,   // fast cars weave between lanes
        phase: Math.random()*Math.PI*2,
        hit: 0
      });
    }
  }

  const findSegment = z => segments[Math.floor(z/segmentLength) % segments.length];

  function project(p, cameraX, cameraY, cameraZ){
    p.camera.x = (p.world.x || 0) - cameraX;
    p.camera.y = (p.world.y || 0) - cameraY;
    p.camera.z = (p.world.z || 0) - cameraZ;
    p.screen.scale = cameraDepth / p.camera.z;
    p.screen.x = (W/2) + (p.screen.scale * p.camera.x * W/2);
    p.screen.y = (H/2) - (p.screen.scale * p.camera.y * H/2);
    p.screen.w =  (p.screen.scale * roadWidth * W/2);
  }

  // ---- update --------------------------------------------------------------
  function update(dt){
    const playerSegment = findSegment(position + playerZ);
    const speedPercent = speed / maxSpeed;
    const dx = dt * 2.4 * speedPercent;

    position = (position + dt*speed) % trackLength;

    const grip = cfg.grip * car.gripMul;
    if (keys.left || touch.left) playerX -= dx * grip;
    if (keys.right || touch.right) playerX += dx * grip;
    playerX -= dx * speedPercent * playerSegment.curve * centrifugal / grip;

    if (keys.gas || touch.gas) speed += accel*dt*car.accelMul;
    else if (keys.brake || touch.brake) speed += braking*dt;
    else speed += decel*dt;

    if ((playerX < -1 || playerX > 1) && speed > offRoadLimit){
      speed += offRoadDecel*dt;
      shake = Math.min(6, shake + 40*dt);
    }

    // traffic
    for (const car of cars){
      car.z = (car.z + dt*car.speed) % trackLength;
      car.hit = Math.max(0, car.hit - dt);
      if (car.drift){
        car.phase += dt * 0.7;
        car.offset = clamp(car.offset + Math.sin(car.phase)*car.drift*dt, -0.88, 0.88);
      }
      const rel = ((car.z - position) + trackLength) % trackLength;
      if (rel < segmentLength*2.2 && Math.abs(playerX - car.offset) < 0.32 && !car.hit){
        const bump = car.fast ? 0.3 : 0.45;
        speed = Math.max(car.speed*0.45, speed*bump);
        playerX += (playerX < car.offset ? -0.24 : 0.24);
        shake = car.fast ? 16 : 12; car.hit = 1.2;
        if (invuln <= 0){
          lives--;
          invuln = 2;
          shake = 22;
          if (lives <= 0){ lives = 0; finish('wreck'); return; }
        }
      }
    }

    playerX = clamp(playerX, -2.2, 2.2);
    speed = clamp(speed, 0, maxSpeed * cfg.topSpeed * car.topMul);
    distance += speed*dt/segmentLength*8;
    shake = Math.max(0, shake - 22*dt);
    if (invuln > 0) invuln = Math.max(0, invuln - dt);

    timeLeft -= dt;
    if (timeLeft <= 0){ timeLeft = 0; finish(); }
  }

  // ---- render --------------------------------------------------------------
  function poly(x1,y1,x2,y2,x3,y3,x4,y4,color){
    ctx.fillStyle = color; ctx.beginPath();
    ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.lineTo(x3,y3); ctx.lineTo(x4,y4);
    ctx.closePath(); ctx.fill();
  }

  const HORIZON = H*0.42;
  const SKY_GRAD = (() => {
    const g = ctx.createLinearGradient(0,0,0,HORIZON);
    g.addColorStop(0, COLORS.sky); g.addColorStop(1, COLORS.skyLow);
    return g;
  })();

  function drawBackground(baseSegment, playerY){
    const horizon = HORIZON;
    ctx.fillStyle = SKY_GRAD; ctx.fillRect(0,0,W,horizon+2);
    ctx.fillStyle = COLORS.light.grass; ctx.fillRect(0,horizon,W,H-horizon);

    const drift = -(position/segmentLength)*1.2 - playerX*24;
    const hills = (yBase, amp, wavelen, color) => {
      ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(0,horizon+4);
      for (let x=0;x<=W;x+=16){
        const t = (x + drift)/wavelen;
        ctx.lineTo(x, yBase - Math.sin(t)*amp - Math.sin(t*2.3)*amp*0.35);
      }
      ctx.lineTo(W,horizon+4); ctx.closePath(); ctx.fill();
    };
    hills(horizon-6, 34, 220, COLORS.hillFar);
    hills(horizon+2, 22, 140, COLORS.hill);

    // drifting clouds
    ctx.fillStyle = 'rgba(255,255,255,.72)';
    const cloudDrift = -(position/segmentLength)*0.35 - playerX*10;
    for (let i=0;i<5;i++){
      const cx = ((i*247 + cloudDrift) % (W+260) + W+260) % (W+260) - 130;
      const cy = 40 + (i % 3)*34;
      const s = 26 + (i % 4)*9;
      ctx.beginPath();
      ctx.ellipse(cx, cy, s, s*0.44, 0,0,Math.PI*2);
      ctx.ellipse(cx+s*0.7, cy+s*0.1, s*0.62, s*0.34, 0,0,Math.PI*2);
      ctx.ellipse(cx-s*0.66, cy+s*0.12, s*0.5, s*0.3, 0,0,Math.PI*2);
      ctx.fill();
    }
  }

  function renderSegment(w1,y1,x1,w2,y2,x2,color){
    const r1 = w1/Math.max(6, 2*lanes), r2 = w2/Math.max(6, 2*lanes);
    const l1 = w1/Math.max(32, 8*lanes), l2 = w2/Math.max(32, 8*lanes);
    poly(0,y2, W,y2, W,y1, 0,y1, color.grass);
    poly(x1-w1-r1,y1, x1-w1,y1, x2-w2,y2, x2-w2-r2,y2, color.rumble);
    poly(x1+w1+r1,y1, x1+w1,y1, x2+w2,y2, x2+w2+r2,y2, color.rumble);
    poly(x1-w1,y1, x1+w1,y1, x2+w2,y2, x2-w2,y2, color.road);
    if (color.lane){
      let lw1 = w1*2/lanes, lw2 = w2*2/lanes;
      let lx1 = x1 - w1 + lw1, lx2 = x2 - w2 + lw2;
      for (let lane=1; lane<lanes; lane++, lx1+=lw1, lx2+=lw2)
        poly(lx1-l1,y1, lx1+l1,y1, lx2+l2,y2, lx2-l2,y2, color.lane);
    }
  }

  function drawCar(x, y, scaleW, color, clipY, fast){
    const w = scaleW, h = w*(fast ? 0.5 : 0.62);
    const top = y - h;
    ctx.save();
    const clipH = Math.max(0, clipY - top);
    ctx.beginPath(); ctx.rect(x-w*1.6, top-h*0.4, w*3.2, Math.min(h*1.6, clipH+h*0.4)); ctx.clip();

    // shadow
    ctx.fillStyle = 'rgba(0,0,0,.22)';
    ctx.beginPath(); ctx.ellipse(x, y, w*1.05, h*0.16, 0, 0, Math.PI*2); ctx.fill();
    // body
    const r = Math.max(2, w*0.22);
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(x-w+r, top); ctx.lineTo(x+w-r, top);
    ctx.quadraticCurveTo(x+w, top, x+w, top+r);
    ctx.lineTo(x+w, y-h*0.12); ctx.quadraticCurveTo(x+w, y, x+w-r, y);
    ctx.lineTo(x-w+r, y); ctx.quadraticCurveTo(x-w, y, x-w, y-h*0.12);
    ctx.lineTo(x-w, top+r); ctx.quadraticCurveTo(x-w, top, x-w+r, top);
    ctx.closePath(); ctx.fill();
    // window + lights
    ctx.fillStyle = 'rgba(25,25,25,.42)';
    ctx.fillRect(x-w*0.62, top+h*0.16, w*1.24, h*0.3);
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    ctx.fillRect(x-w*0.86, y-h*0.34, w*0.3, h*0.16);
    ctx.fillRect(x+w*0.56, y-h*0.34, w*0.3, h*0.16);
    if (fast){
      // racing stripe + wing so speedsters read differently
      ctx.fillStyle = 'rgba(255,255,255,.9)';
      ctx.fillRect(x-w*0.14, top, w*0.28, h);
      ctx.fillStyle = '#2C2C2B';
      ctx.fillRect(x-w*1.02, top-h*0.16, w*2.04, Math.max(1, h*0.14));
      // speed streaks
      ctx.strokeStyle = 'rgba(255,255,255,.35)';
      ctx.lineWidth = Math.max(1, w*0.06);
      ctx.beginPath();
      ctx.moveTo(x-w*1.5, y-h*0.5); ctx.lineTo(x-w*1.05, y-h*0.5);
      ctx.moveTo(x+w*1.05, y-h*0.5); ctx.lineTo(x+w*1.5, y-h*0.5);
      ctx.stroke();
    }
    ctx.restore();
  }

  // ---- roadside sprite art -------------------------------------------------
  function drawSprite(type, x, groundY, scale, size, clipY){
    // unit: width in road-space, converted through the same projection scale
    const u = scale * 900 * size * W/2;
    if (u < 0.6 || groundY > H + 40) return;
    ctx.save();
    ctx.beginPath(); ctx.rect(0, 0, W, Math.max(0, clipY)); ctx.clip();
    const trunk = '#6B5443';

    const shadow = (rx) => {
      ctx.fillStyle = 'rgba(0,0,0,.14)';
      ctx.beginPath(); ctx.ellipse(x, groundY, rx, rx*0.22, 0,0,Math.PI*2); ctx.fill();
    };

    if (type === 'pine'){
      shadow(u*0.45);
      ctx.fillStyle = trunk;
      ctx.fillRect(x-u*0.06, groundY-u*0.5, u*0.12, u*0.5);
      for (let i=0;i<3;i++){
        const top = groundY - u*(1.9 - i*0.45), base = groundY - u*(0.95 - i*0.42);
        const halfW = u*(0.28 + i*0.16);
        ctx.fillStyle = i === 0 ? '#54936F' : (i === 1 ? '#3F7D5B' : '#356B4D');
        ctx.beginPath();
        ctx.moveTo(x, top); ctx.lineTo(x+halfW, base); ctx.lineTo(x-halfW, base);
        ctx.closePath(); ctx.fill();
      }
    } else if (type === 'oak'){
      shadow(u*0.5);
      ctx.fillStyle = trunk;
      ctx.fillRect(x-u*0.08, groundY-u*0.7, u*0.16, u*0.7);
      const blobs = [[0,-1.15,0.55],[-0.38,-0.9,0.42],[0.4,-0.92,0.44],[0,-1.5,0.36]];
      blobs.forEach((b,i) => {
        ctx.fillStyle = i % 2 ? '#3E7F5C' : '#4E9270';
        ctx.beginPath(); ctx.ellipse(x+u*b[0], groundY+u*b[1], u*b[2], u*b[2]*0.9, 0,0,Math.PI*2); ctx.fill();
      });
    } else if (type === 'bush'){
      shadow(u*0.3);
      ctx.fillStyle = '#437F5F';
      ctx.beginPath(); ctx.ellipse(x, groundY-u*0.16, u*0.34, u*0.22, 0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = '#54936F';
      ctx.beginPath(); ctx.ellipse(x-u*0.16, groundY-u*0.2, u*0.2, u*0.16, 0,0,Math.PI*2); ctx.fill();
    } else if (type === 'post'){
      ctx.fillStyle = '#EDEAE6';
      ctx.fillRect(x-u*0.035, groundY-u*0.36, u*0.07, u*0.36);
      ctx.fillStyle = '#E56458';
      ctx.fillRect(x-u*0.035, groundY-u*0.36, u*0.07, u*0.1);
    } else if (type === 'sign'){
      ctx.fillStyle = '#7D7A75';
      ctx.fillRect(x-u*0.04, groundY-u*0.9, u*0.08, u*0.9);
      ctx.fillStyle = '#2783DE';
      ctx.beginPath();
      ctx.moveTo(x, groundY-u*1.35); ctx.lineTo(x+u*0.34, groundY-u*0.95);
      ctx.lineTo(x, groundY-u*0.55); ctx.lineTo(x-u*0.34, groundY-u*0.95);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(x-u*0.16, groundY-u*0.99, u*0.32, u*0.08);
    } else if (type === 'billboard'){
      ctx.fillStyle = '#7D7A75';
      ctx.fillRect(x-u*0.5, groundY-u*0.5, u*0.09, u*0.5);
      ctx.fillRect(x+u*0.41, groundY-u*0.5, u*0.09, u*0.5);
      ctx.fillStyle = '#F9F8F7';
      ctx.fillRect(x-u*0.72, groundY-u*1.5, u*1.44, u*1.0);
      ctx.fillStyle = '#2783DE';
      ctx.fillRect(x-u*0.72, groundY-u*1.5, u*1.44, u*0.2);
      ctx.fillStyle = '#DE9255';
      ctx.fillRect(x-u*0.6, groundY-u*1.12, u*0.55, u*0.45);
      ctx.fillStyle = '#E6E5E3';
      ctx.fillRect(x+u*0.02, groundY-u*1.06, u*0.6, u*0.1);
      ctx.fillRect(x+u*0.02, groundY-u*0.86, u*0.45, u*0.09);
    } else if (type === 'windmill'){
      shadow(u*0.3);
      ctx.fillStyle = '#EDEAE6';
      ctx.beginPath();
      ctx.moveTo(x-u*0.1, groundY); ctx.lineTo(x+u*0.1, groundY);
      ctx.lineTo(x+u*0.05, groundY-u*2.1); ctx.lineTo(x-u*0.05, groundY-u*2.1);
      ctx.closePath(); ctx.fill();
      const hubY = groundY-u*2.1, ang = (position/segmentLength)*0.25 + x*0.01;
      ctx.strokeStyle = '#D9D6D2'; ctx.lineWidth = Math.max(1, u*0.06);
      for (let i=0;i<3;i++){
        const a = ang + i*Math.PI*2/3;
        ctx.beginPath(); ctx.moveTo(x, hubY);
        ctx.lineTo(x + Math.cos(a)*u*0.8, hubY + Math.sin(a)*u*0.8);
        ctx.stroke();
      }
    } else if (type === 'arch'){
      ctx.fillStyle = '#2C2C2B';
      ctx.fillRect(x-u*2.1, groundY-u*1.5, u*0.22, u*1.5);
      ctx.fillRect(x+u*1.88, groundY-u*1.5, u*0.22, u*1.5);
      ctx.fillStyle = '#2783DE';
      ctx.fillRect(x-u*2.1, groundY-u*1.9, u*4.2, u*0.45);
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(x-u*1.2, groundY-u*1.78, u*2.4, u*0.2);
    }
    ctx.restore();
  }

  function drawPlayer(dtSteer, bounceSeed){
    const scaleW = W*0.075;
    const bounce = Math.sin(bounceSeed*9)*(speed/maxSpeed)*3;
    const x = W/2 + dtSteer;
    const y = H*0.9 + bounce;
    const w = scaleW, h = w*1.15;
    const shape = car.shape;
    ctx.save();
    // shadow
    ctx.fillStyle = 'rgba(0,0,0,.25)';
    ctx.beginPath(); ctx.ellipse(x, y+4, w*1.15, h*0.14, 0,0,Math.PI*2); ctx.fill();

    if (shape === 'formula'){
      ctx.fillStyle = '#2C2C2B';
      ctx.fillRect(x-w*1.05, y-h*0.98, w*2.1, h*0.14);
      ctx.fillStyle = car.body;
      ctx.beginPath();
      ctx.moveTo(x-w*0.55, y-h); ctx.lineTo(x+w*0.55, y-h);
      ctx.quadraticCurveTo(x+w*0.95, y-h*0.55, x+w*0.9, y-h*0.05);
      ctx.lineTo(x-w*0.9, y-h*0.05);
      ctx.quadraticCurveTo(x-w*0.95, y-h*0.55, x-w*0.55, y-h);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = car.accent;
      ctx.fillRect(x-w*0.1, y-h, w*0.2, h*0.95);
      ctx.fillStyle = 'rgba(25,25,25,.55)';
      ctx.beginPath(); ctx.ellipse(x, y-h*0.62, w*0.36, h*0.2, 0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = '#1F1F1E';
      ctx.fillRect(x-w*1.12, y-h*0.62, w*0.3, h*0.34);
      ctx.fillRect(x+w*0.82, y-h*0.62, w*0.3, h*0.34);
      ctx.fillRect(x-w*1.02, y-h*0.24, w*0.34, h*0.26);
      ctx.fillRect(x+w*0.68, y-h*0.24, w*0.34, h*0.26);
    } else if (shape === 'wedge'){
      ctx.fillStyle = '#1F1F1E';
      ctx.fillRect(x-w*1.06, y-h*0.5, w*0.32, h*0.42);
      ctx.fillRect(x+w*0.74, y-h*0.5, w*0.32, h*0.42);
      ctx.fillStyle = '#2C2C2B';
      ctx.fillRect(x-w*1.0, y-h*1.02, w*2.0, h*0.12);
      ctx.fillStyle = car.body;
      ctx.beginPath();
      ctx.moveTo(x-w*0.42, y-h*1.0); ctx.lineTo(x+w*0.42, y-h*1.0);
      ctx.lineTo(x+w*0.98, y-h*0.3); ctx.lineTo(x+w*0.9, y-h*0.02);
      ctx.lineTo(x-w*0.9, y-h*0.02); ctx.lineTo(x-w*0.98, y-h*0.3);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(25,25,25,.5)';
      ctx.fillRect(x-w*0.5, y-h*0.86, w*1.0, h*0.26);
      ctx.fillStyle = car.accent;
      ctx.fillRect(x-w*0.86, y-h*0.2, w*1.72, h*0.08);
    } else if (shape === 'truck'){
      ctx.fillStyle = '#1F1F1E';
      ctx.fillRect(x-w*1.14, y-h*0.56, w*0.38, h*0.5);
      ctx.fillRect(x+w*0.76, y-h*0.56, w*0.38, h*0.5);
      ctx.fillStyle = car.body;
      ctx.fillRect(x-w*0.92, y-h*0.78, w*1.84, h*0.72);
      ctx.fillStyle = 'rgba(25,25,25,.5)';
      ctx.fillRect(x-w*0.66, y-h*1.12, w*1.32, h*0.36);
      ctx.fillStyle = car.body;
      ctx.fillRect(x-w*0.72, y-h*1.18, w*1.44, h*0.1);
      ctx.fillStyle = car.accent;
      ctx.fillRect(x-w*0.92, y-h*0.34, w*1.84, h*0.1);
      ctx.fillStyle = '#EAC26B';
      ctx.fillRect(x-w*0.5, y-h*1.24, w*1.0, h*0.08);
    } else { // coupe
      ctx.fillStyle = '#1F1F1E';
      ctx.fillRect(x-w*1.02, y-h*0.42, w*0.32, h*0.4);
      ctx.fillRect(x+w*0.7, y-h*0.42, w*0.32, h*0.4);
      // cabin
      ctx.fillStyle = car.body;
      ctx.beginPath();
      ctx.moveTo(x-w*0.62, y-h*0.6);
      ctx.lineTo(x-w*0.42, y-h*1.02);
      ctx.lineTo(x+w*0.42, y-h*1.02);
      ctx.lineTo(x+w*0.62, y-h*0.6);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(25,25,25,.5)';
      ctx.fillRect(x-w*0.36, y-h*0.96, w*0.72, h*0.28);
      // lower body
      ctx.fillStyle = car.body;
      ctx.beginPath();
      ctx.moveTo(x-w*0.9, y-h*0.62); ctx.lineTo(x+w*0.9, y-h*0.62);
      ctx.quadraticCurveTo(x+w*0.94, y-h*0.2, x+w*0.84, y-h*0.04);
      ctx.lineTo(x-w*0.84, y-h*0.04);
      ctx.quadraticCurveTo(x-w*0.94, y-h*0.2, x-w*0.9, y-h*0.62);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = car.accent;
      ctx.fillRect(x-w*0.84, y-h*0.44, w*1.68, h*0.08);
      // taillights
      ctx.fillStyle = '#E56458';
      ctx.fillRect(x-w*0.78, y-h*0.28, w*0.34, h*0.12);
      ctx.fillRect(x+w*0.44, y-h*0.28, w*0.34, h*0.12);
    }
    ctx.restore();
  }

  const trafficBuckets = new Map();

  function render(t){
    const baseSegment = findSegment(position);
    const basePercent = (position % segmentLength) / segmentLength;
    const playerSegment = findSegment(position + playerZ);
    const playerPercent = ((position + playerZ) % segmentLength) / segmentLength;
    const playerY = lerp(playerSegment.p1.world.y, playerSegment.p2.world.y, playerPercent);

    ctx.save();
    if (shake > 0.2) ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
    ctx.clearRect(0,0,W,H);
    drawBackground(baseSegment, playerY);

    let maxy = H, x = 0, dx = -(baseSegment.curve * basePercent);
    for (let n=0; n<drawDistance; n++){
      const seg = segments[(baseSegment.index + n) % segments.length];
      seg.looped = seg.index < baseSegment.index;
      seg.clip = maxy;
      const camZ = position - (seg.looped ? trackLength : 0);
      project(seg.p1, playerX*roadWidth - x,        playerY + cameraHeight, camZ);
      project(seg.p2, playerX*roadWidth - x - dx,   playerY + cameraHeight, camZ);
      x += dx; dx += seg.curve;
      if (seg.p1.camera.z <= cameraDepth || seg.p2.screen.y >= seg.p1.screen.y || seg.p2.screen.y >= maxy) continue;
      renderSegment(seg.p1.screen.w, seg.p1.screen.y, seg.p1.screen.x,
                    seg.p2.screen.w, seg.p2.screen.y, seg.p2.screen.x, seg.color);
      maxy = seg.p2.screen.y;
    }

    // bucket traffic by segment once per frame (avoids scanning every car per segment)
    trafficBuckets.clear();
    for (const tc of cars){
      const idx = Math.floor(tc.z/segmentLength) % segments.length;
      const bucket = trafficBuckets.get(idx);
      if (bucket) bucket.push(tc); else trafficBuckets.set(idx, [tc]);
    }

    // scenery + traffic, far to near
    for (let n=drawDistance-1; n>0; n--){
      const seg = segments[(baseSegment.index + n) % segments.length];
      if (!seg.p1.screen.scale || seg.p1.camera.z <= cameraDepth) continue;
      const scale = seg.p1.screen.scale;
      if (seg.p1.screen.y > H) continue;

      const spriteUnit = scale * roadWidth * W/2;
      for (const sp of seg.sprites){
        const sx = seg.p1.screen.x + spriteUnit * sp.offset;
        const half = scale * 900 * sp.size * W;
        if (half < 0.6 || sx + half < 0 || sx - half > W) continue;
        drawSprite(sp.type, sx, seg.p1.screen.y, scale, sp.size, seg.clip);
      }

      const here = trafficBuckets.get(seg.index);
      if (!here) continue;
      for (const tc of here){
        const pct = (tc.z % segmentLength) / segmentLength;
        const cScale = lerp(seg.p1.screen.scale, seg.p2.screen.scale, pct);
        const sx = lerp(seg.p1.screen.x, seg.p2.screen.x, pct) + (cScale * tc.offset * roadWidth * W/2);
        const sy = lerp(seg.p1.screen.y, seg.p2.screen.y, pct);
        const sw = cScale * tc.w * W/2;
        if (sw < 1.5 || sy > H || sx + sw*1.6 < 0 || sx - sw*1.6 > W) continue;
        drawCar(sx, sy, sw, tc.color, seg.clip, tc.fast);
      }
    }

    // blink the player while recovering from a crash
    if (invuln <= 0 || Math.floor(t/120) % 3 !== 0) drawPlayer(clamp(playerX,-1.6,1.6) * W*0.02, t/1000);
    ctx.restore();
  }

  // ---- loop / state --------------------------------------------------------
  const el = id => document.getElementById(id);
  const hudCache = { speed:-1, dist:-1, time:'', lives:-1 };
  function updateHud(){
    const sp = Math.round(speed/maxSpeed*260);
    if (sp !== hudCache.speed){ hudCache.speed = sp; el('hudSpeed').textContent = sp; }
    const di = Math.round(distance);
    if (di !== hudCache.dist){ hudCache.dist = di; el('hudDist').textContent = di; }
    const tm = timeLeft.toFixed(1);
    if (tm !== hudCache.time){ hudCache.time = tm; el('hudTime').textContent = tm; }
    if (lives !== hudCache.lives){
      hudCache.lives = lives;
      el('hudLives').textContent = '♥'.repeat(lives) + '♡'.repeat(MAX_LIVES - lives);
    }
  }
  function renderScores(){
    const list = loadScores();
    const node = el('scores');
    if (!list.length){ node.innerHTML = ''; return; }
    node.innerHTML = '<div class="cap">High scores</div>' + list.map((s, i) =>
      '<div class="row"><b>' + (i+1) + '</b>' +
      ((CARS[s.car] && CARS[s.car].name) || 'Comet GT') + ' · ' +
      ((DIFFS[s.diff] && DIFFS[s.diff].label.toLowerCase()) || 'normal') +
      '<span>' + s.d + ' m</span></div>').join('');
  }
  function showBest(){
    el('bestLine').textContent = best ? 'Best (' + cfg.label.toLowerCase() + ') ' + Math.round(best) + ' m' : '';
    el('hudDiff').textContent = cfg.label;
    el('sub').textContent = cfg.timer + '-second time attack · ' + cfg.label.toLowerCase() + ' · ' + car.name;
  }

  function setCar(key){
    if (!CARS[key]) return;
    carKey = key; car = CARS[key];
    localStorage.setItem('ridgeSprintCar', key);
    document.querySelectorAll('#cars .diff').forEach(b =>
      b.setAttribute('aria-pressed', String(b.dataset.car === key)));
    showBest();
  }

  function setDifficulty(key){
    if (!DIFFS[key]) return;
    difficulty = key; cfg = DIFFS[key];
    localStorage.setItem('ridgeSprintDiff', key);
    best = Number(localStorage.getItem(bestKey(key)) || 0);
    timeLeft = cfg.timer;
    document.querySelectorAll('#diffs .diff').forEach(b =>
      b.setAttribute('aria-pressed', String(b.dataset.diff === key)));
    showBest();
  }

  function startRace(){
    buildTrack(); buildTraffic();
    position = 0; speed = 0; playerX = 0; distance = 0; timeLeft = cfg.timer; shake = 0;
    lives = MAX_LIVES; invuln = 0;
    hudCache.speed = hudCache.dist = hudCache.lives = -1; hudCache.time = '';
    state = 'playing';
    el('overlay').classList.add('hide');
  }

  function finish(reason){
    state = 'over';
    speed = 0;
    const scored = Math.round(distance);
    const prevTop = (loadScores()[0] || { d: 0 }).d;
    saveScore(distance);
    const isRecord = scored > prevTop;
    if (distance > best){ best = distance; localStorage.setItem(bestKey(difficulty), String(Math.round(best))); }
    showBest();
    renderScores();
    el('ovTitle').textContent = (reason === 'wreck' ? 'Wrecked · ' : '') + scored + ' m';
    el('ovText').textContent = (reason === 'wreck'
        ? 'All three lives gone. '
        : 'Time up on ' + cfg.label.toLowerCase() + '. ') +
      (isRecord ? 'New high score!' : 'Best (' + cfg.label.toLowerCase() + '): ' + Math.round(best) + ' m.') +
      ' Weave early and lift off before the curves to keep your lives.';
    el('startBtn').textContent = 'Race again';
    el('overlay').classList.remove('hide');
  }

  let last = 0;
  function frame(t){
    const dt = Math.min(0.05, (t - last)/1000 || 0);
    last = t;
    if (state === 'playing') update(dt);
    render(t);
    updateHud();
    requestAnimationFrame(frame);
  }

  // input
  const keyMap = {
    ArrowLeft:'left', a:'left', A:'left',
    ArrowRight:'right', d:'right', D:'right',
    ArrowUp:'gas', w:'gas', W:'gas',
    ArrowDown:'brake', s:'brake', S:'brake'
  };
  addEventListener('keydown', e => {
    if (keyMap[e.key]){ keys[keyMap[e.key]] = true; e.preventDefault(); }
    if (e.key === 'r' || e.key === 'R') startRace();
    if (e.key === ' ' && state !== 'playing') startRace();
  });
  addEventListener('keyup', e => { if (keyMap[e.key]) keys[keyMap[e.key]] = false; });

  const bindPad = (id, prop) => {
    const node = el(id);
    const on = e => { e.preventDefault(); touch[prop] = true; };
    const off = e => { e.preventDefault(); touch[prop] = false; };
    node.addEventListener('pointerdown', on);
    node.addEventListener('pointerup', off);
    node.addEventListener('pointerleave', off);
    node.addEventListener('pointercancel', off);
  };
  bindPad('padLeft','left'); bindPad('padRight','right');
  bindPad('padGas','gas'); bindPad('padBrake','brake');

  el('startBtn').addEventListener('click', startRace);
  el('diffs').addEventListener('click', e => {
    const btn = e.target.closest('.diff');
    if (btn) setDifficulty(btn.dataset.diff);
  });
  el('cars').addEventListener('click', e => {
    const btn = e.target.closest('.diff');
    if (btn) setCar(btn.dataset.car);
  });
  addEventListener('keydown', e => {
    if (state !== 'playing'){
      if (e.key === '1') setDifficulty('easy');
      if (e.key === '2') setDifficulty('normal');
      if (e.key === '3') setDifficulty('pro');
    }
  });

  setCar(carKey);
  setDifficulty(difficulty);
  buildTrack(); buildTraffic(); showBest(); renderScores();

  if (location.hash.indexOf('auto') >= 0){
    startRace();
    keys.gas = true;
    for (let i=0;i<200;i++) update(1/60);
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
